<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzApp PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .modal-bg { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; position: fixed; inset: 0; z-index: 100; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 2rem; border-radius: 1.5rem; }
        .hidden { display: none; }
        .active-tab { color: #4f46e5 !important; border-top: 2px solid #4f46e5; }
    </style>
</head>
<body class="pb-24">

    <!-- CABECERA -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">FinanzApp Pro</h1>
            <div class="flex gap-2">
                <button id="btn-login" onclick="handleAuthClick()" class="text-[10px] bg-white/20 px-3 py-1 rounded-full">Conectar Drive</button>
                <button id="btn-sync" onclick="saveToDrive()" class="hidden text-[10px] bg-emerald-500 px-3 py-1 rounded-full italic">Sincronizar</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- RESUMEN INICIO -->
        <section id="sec-dashboard" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">Ingresos</p>
                    <h2 id="val-incomes" class="text-xl font-bold text-emerald-600">$0.00</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm">
                    <p class="text-gray-400 text-[10px] font-bold uppercase">Abonado</p>
                    <h2 id="val-paid" class="text-xl font-bold text-rose-500">$0.00</h2>
                </div>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl text-white shadow-xl">
                <p class="text-indigo-300 text-xs font-bold uppercase">Disponible Total</p>
                <h2 id="val-available" class="text-3xl font-bold">$0.00</h2>
                <div class="mt-4 pt-4 border-t border-slate-700">
                    <p class="text-[10px] opacity-60">DEUDA TOTAL TARJETAS: <span id="val-debt" class="font-bold text-white"></span></p>
                    <p class="text-[10px] opacity-60">REQUERIDO ESTE MES: <span id="val-month" class="font-bold text-indigo-400"></span></p>
                </div>
            </div>
        </section>

        <!-- SECCIÓN TARJETAS -->
        <section id="sec-cards" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold">Mis Tarjetas</h2>
                <button onclick="openModal('modal-card')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+ Nueva</button>
            </div>
            <div id="list-cards" class="space-y-4"></div>
        </section>

        <!-- SECCIÓN PAGOS -->
        <section id="sec-payments" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold">Historial de Abonos</h2>
                <button onclick="openModal('modal-pay')" class="bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Registrar Abono</button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden" id="list-payments"></div>
        </section>

        <!-- SECCIÓN INGRESOS -->
        <section id="sec-incomes" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold">Mis Ingresos</h2>
                <button onclick="openModal('modal-income')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">+ Nuevo</button>
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden" id="list-incomes"></div>
        </section>

    </main>

    <!-- NAVEGACIÓN -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex justify-around p-3 z-50">
        <button onclick="showSec('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-xs font-bold active-tab"><i class="fas fa-home text-lg"></i><span>Inicio</span></button>
        <button onclick="showSec('cards')" id="nav-cards" class="flex flex-col items-center text-xs font-bold text-gray-400"><i class="fas fa-credit-card text-lg"></i><span>Tarjetas</span></button>
        <button onclick="showSec('payments')" id="nav-payments" class="flex flex-col items-center text-xs font-bold text-gray-400"><i class="fas fa-history text-lg"></i><span>Pagos</span></button>
        <button onclick="showSec('incomes')" id="nav-incomes" class="flex flex-col items-center text-xs font-bold text-gray-400"><i class="fas fa-wallet text-lg"></i><span>Ingresos</span></button>
    </nav>

    <!-- MODAL TARJETA -->
    <div id="modal-card" class="modal-bg">
        <div class="modal-content space-y-4">
            <h3 class="font-bold text-lg">Nueva Tarjeta</h3>
            <input type="text" id="c-name" placeholder="Nombre Tarjeta" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <input type="text" id="c-bank" placeholder="Banco" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="c-cut" placeholder="Día Corte" class="p-3 bg-gray-100 rounded-xl outline-none">
                <input type="number" id="c-pay" placeholder="Día Pago" class="p-3 bg-gray-100 rounded-xl outline-none">
            </div>
            <div class="flex gap-2">
                <button onclick="addCard()" class="flex-1 bg-indigo-600 text-white p-3 rounded-xl font-bold">Guardar</button>
                <button onclick="closeModal('modal-card')" class="p-3 text-gray-400">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL COMPRA -->
    <div id="modal-exp" class="modal-bg">
        <div class="modal-content space-y-4">
            <h3 class="font-bold text-lg">Registrar Compra</h3>
            <input type="hidden" id="exp-card-id">
            <input type="text" id="e-desc" placeholder="Descripción" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <input type="number" id="e-amount" placeholder="Monto" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <select id="e-type" onchange="document.getElementById('msi-div').classList.toggle('hidden', this.value=='contado')" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
                <option value="contado">Contado</option>
                <option value="msi">Meses (MSI/Intereses)</option>
            </select>
            <div id="msi-div" class="hidden grid grid-cols-2 gap-2">
                <input type="number" id="e-months" placeholder="Meses" class="p-3 bg-gray-100 rounded-xl outline-none">
                <input type="number" id="e-int" placeholder="Interés %" class="p-3 bg-gray-100 rounded-xl outline-none" value="0">
            </div>
            <button onclick="addExp()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold">Agregar</button>
            <button onclick="closeModal('modal-exp')" class="w-full text-gray-400">Cancelar</button>
        </div>
    </div>

    <!-- MODAL PAGO -->
    <div id="modal-pay" class="modal-bg">
        <div class="modal-content space-y-4">
            <h3 class="font-bold text-lg">Registrar Abono</h3>
            <select id="p-card" class="w-full p-3 bg-gray-100 rounded-xl outline-none"></select>
            <input type="date" id="p-date" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <input type="number" id="p-amount" placeholder="Monto abonado" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <button onclick="addPay()" class="w-full bg-rose-500 text-white p-3 rounded-xl font-bold">Guardar</button>
            <button onclick="closeModal('modal-pay')" class="w-full text-gray-400">Cerrar</button>
        </div>
    </div>

    <!-- MODAL INGRESO -->
    <div id="modal-income" class="modal-bg">
        <div class="modal-content space-y-4">
            <h3 class="font-bold text-lg">Nuevo Ingreso</h3>
            <input type="text" id="i-desc" placeholder="Concepto" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <input type="number" id="i-amount" placeholder="Monto mensual" class="w-full p-3 bg-gray-100 rounded-xl outline-none">
            <button onclick="addIncome()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold">Guardar</button>
            <button onclick="closeModal('modal-income')" class="w-full text-gray-400">Cerrar</button>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const CLIENT_ID = '764556873375-etu7k4dnc1o6uimg7kvai1m18v06s61i.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let state = { cards: [], expenses: [], payments: [], incomes: [] };
        let tokenClient;

        // --- CORE ---
        function init() {
            const data = localStorage.getItem('finanz_data_v4');
            if(data) state = JSON.parse(data);
            render();
        }

        function save() {
            localStorage.setItem('finanz_data_v4', JSON.stringify(state));
            render();
        }

        function render() {
            const fmt = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n || 0);
            
            // Dashboard Calculations
            let totalInc = state.incomes.reduce((a, b) => a + b.amount, 0);
            let totalPaid = state.payments.reduce((a, b) => a + b.amount, 0);
            let globalDebt = 0;
            let globalMonth = 0;

            state.cards.forEach(c => {
                const exps = state.expenses.filter(e => e.cardId === c.id);
                exps.forEach(e => {
                    const total = e.amount * (1 + (e.interest / 100));
                    globalDebt += total;
                    globalMonth += (total / e.months);
                });
            });

            document.getElementById('val-incomes').innerText = fmt(totalInc);
            document.getElementById('val-paid').innerText = fmt(totalPaid);
            document.getElementById('val-available').innerText = fmt(totalInc - totalPaid);
            document.getElementById('val-debt').innerText = fmt(globalDebt);
            document.getElementById('val-month').innerText = fmt(globalMonth);

            // List Cards
            const divCards = document.getElementById('list-cards');
            divCards.innerHTML = state.cards.map(c => {
                const myExps = state.expenses.filter(e => e.cardId === c.id);
                return `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="bg-slate-700 p-4 text-white flex justify-between items-center">
                        <div><p class="font-bold text-sm">${c.name}</p><p class="text-[10px] opacity-60">${c.bank}</p></div>
                        <button onclick="openModal('modal-exp', ${c.id})" class="bg-indigo-500 px-3 py-1 rounded-lg text-[10px] font-bold">+ Compra</button>
                    </div>
                    <div class="p-4 space-y-2">
                        ${myExps.map(e => `
                            <div class="flex justify-between text-xs py-1 border-b border-gray-50">
                                <span>${e.desc}</span>
                                <div class="flex gap-2"><b>${fmt(e.amount)}</b><button onclick="del('expenses', ${e.id})" class="text-gray-300">×</button></div>
                            </div>
                        `).join('')}
                        <button onclick="del('cards', ${c.id})" class="text-[9px] text-gray-300 underline">Eliminar tarjeta</button>
                    </div>
                </div>`;
            }).join('');

            // List Incomes
            document.getElementById('list-incomes').innerHTML = state.incomes.map(i => `
                <div class="p-4 border-b flex justify-between items-center">
                    <span class="text-sm font-bold">${i.desc}</span>
                    <div class="flex gap-3 items-center"><b>${fmt(i.amount)}</b><button onclick="del('incomes', ${i.id})" class="text-rose-400">×</button></div>
                </div>
            `).join('');

            // List Payments
            document.getElementById('list-payments').innerHTML = state.payments.map(p => {
                const card = state.cards.find(c => c.id === p.cardId);
                return `
                <div class="p-4 border-b flex justify-between items-center text-xs">
                    <span>${p.date} - <b>${card?card.name:'?'}</b></span>
                    <div class="flex gap-3 items-center text-rose-500 font-bold">-${fmt(p.amount)}<button onclick="del('payments', ${p.id})" class="text-gray-300 font-normal">×</button></div>
                </div>`;
            }).join('');
        }

        // --- ACTIONS ---
        function openModal(id, extra) { 
            document.getElementById(id).style.display = 'flex'; 
            if(extra) document.getElementById('exp-card-id').value = extra;
            if(id === 'modal-pay') {
                const s = document.getElementById('p-card');
                s.innerHTML = state.cards.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                document.getElementById('p-date').value = new Date().toISOString().split('T')[0];
            }
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function showSec(id) {
            ['dashboard', 'cards', 'payments', 'incomes'].forEach(s => {
                document.getElementById('sec-'+s).classList.toggle('hidden', s !== id);
                document.getElementById('nav-'+s).classList.toggle('active-tab', s === id);
            });
        }

        function addCard() {
            state.cards.push({ id: Date.now(), name: document.getElementById('c-name').value, bank: document.getElementById('c-bank').value, cut: document.getElementById('c-cut').value, pay: document.getElementById('c-pay').value });
            save(); closeModal('modal-card');
        }
        function addIncome() {
            state.incomes.push({ id: Date.now(), desc: document.getElementById('i-desc').value, amount: parseFloat(document.getElementById('i-amount').value) || 0 });
            save(); closeModal('modal-income');
        }
        function addExp() {
            state.expenses.push({ 
                id: Date.now(), 
                cardId: parseInt(document.getElementById('exp-card-id').value), 
                desc: document.getElementById('e-desc').value, 
                amount: parseFloat(document.getElementById('e-amount').value) || 0,
                type: document.getElementById('e-type').value,
                months: parseInt(document.getElementById('e-months').value) || 1,
                interest: parseFloat(document.getElementById('e-int').value) || 0
            });
            save(); closeModal('modal-exp');
        }
        function addPay() {
            state.payments.push({ id: Date.now(), cardId: parseInt(document.getElementById('p-card').value), date: document.getElementById('p-date').value, amount: parseFloat(document.getElementById('p-amount').value) || 0 });
            save(); closeModal('modal-pay');
        }
        function del(type, id) { if(confirm('¿Eliminar?')) { state[type] = state[type].filter(i => i.id !== id); save(); } }

        // --- DRIVE ---
        function gapiLoaded() { gapi.load('client', () => gapi.client.init({discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]})); }
        function gisLoaded() { 
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES, 
                callback: (resp) => { if(resp.access_token) { document.getElementById('btn-login').classList.add('hidden'); document.getElementById('btn-sync').classList.remove('hidden'); loadFromDrive(); } }
            }); 
        }
        function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

        async function saveToDrive() {
            const fileName = "finanzapp_cloud.json";
            const response = await gapi.client.drive.files.list({ q: `name = '${fileName}' and trashed = false` });
            const file = response.result.files[0];
            const metadata = { name: fileName, mimeType: 'application/json' };
            const blob = new Blob([JSON.stringify(state)], {type: 'application/json'});
            const fd = new FormData();
            fd.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
            fd.append('file', blob);
            await fetch(file ? `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=multipart` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: file ? 'PATCH' : 'POST',
                headers: { 'Authorization': `Bearer ${gapi.client.getToken().access_token}` },
                body: fd
            });
            alert("Sincronizado");
        }

        async function loadFromDrive() {
            const response = await gapi.client.drive.files.list({ q: "name = 'finanzapp_cloud.json' and trashed = false" });
            const file = response.result.files[0];
            if(file) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, { headers: { 'Authorization': `Bearer ${gapi.client.getToken().access_token}` } });
                const data = await res.json();
                if(confirm("¿Cargar datos de la nube?")) { state = data; save(); }
            }
        }

        window.onload = init;
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
