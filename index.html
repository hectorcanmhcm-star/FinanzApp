<!-- 👇 PEGA ESTO JUSTO ARRIBA DE </body> 👇 -->
    <button onclick="emergencyRestore()" class="fixed top-24 right-4 bg-rose-600 text-white p-3 rounded-xl font-bold shadow-2xl z-50 border-2 border-white">🆘 MODO RESCATE</button>
    <script>
    async function emergencyRestore() {
        try {
            const token = gapi.client?.getToken()?.access_token;
            if(!token) return alert("Primero presiona 'Conectar Drive' arriba para darme permisos.");
            
            const resFile = await gapi.client.drive.files.list({ q: "name = 'finanzapp_cloud.json' and trashed = false", fields: 'files(id)' });
            const fileId = resFile.result.files?.[0]?.id;
            if(!fileId) return alert("No se encontró el archivo en tu Drive.");

            const resRevs = await gapi.client.drive.revisions.list({ fileId: fileId, fields: 'revisions(id, modifiedTime, size)' });
            const revs = resRevs.result.revisions;
            
            if(!revs || revs.length === 0) return alert("No hay historial de versiones.");

            const ultimas = revs.slice(-6);
            let mensaje = "MÁQUINA DEL TIEMPO ⏳\n\n";
            ultimas.forEach((r, i) => {
                const isVacia = parseInt(r.size) < 150 ? "(VACÍA)" : "✓ (CON DATOS)";
                mensaje += `[ ${i} ] -> ${new Date(r.modifiedTime).toLocaleString()} ${isVacia}\n`;
            });
            
            const seleccion = prompt(mensaje + "\nIngresa el número [0, 1, 2...] de la versión que diga ✓ (CON DATOS) para cargarla:");
            
            if(seleccion !== null && ultimas[seleccion]) {
                const targetRev = ultimas[seleccion];
                const resData = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/revisions/${targetRev.id}?alt=media`, { headers: { 'Authorization': `Bearer ${token}` } });
                const oldData = await resData.json();
                
                state = migrateState(oldData);
                saveToStorageOnly();
                render();
                alert("¡DATOS RESTAURADOS EN PANTALLA! 🎉\n\nRevisa que tus tarjetas estén ahí. Si todo está correcto, presiona el botón normal de 'Subir' (el verde arriba) para guardar esta versión rescatada como la oficial.");
            }
        } catch(e) {
            alert("Error en el rescate: " + e.message);
        }
    }
    </script>
