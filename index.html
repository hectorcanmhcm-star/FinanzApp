<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzApp Pro - Sync Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card-neo { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        .modal-bg { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 100; }
        .hidden { display: none; }
    </style>
</head>
<body class="pb-28">

    <!-- HEADER CON GOOGLE DRIVE -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">FinanzApp Pro</h1>
                <p id="current-date" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest"></p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-login" onclick="handleAuthClick()" class="text-[10px] bg-slate-100 px-3 py-1.5 rounded-full font-bold text-slate-600 hover:bg-slate-200 transition">
                    <i class="fab fa-google mr-1"></i> Conectar Drive
                </button>
                <button id="btn-sync" onclick="saveToDrive()" class="hidden text-[10px] bg-indigo-600 px-3 py-1.5 rounded-full font-bold text-white shadow-lg">
                    <i class="fas fa-sync-alt mr-1"></i> Sincronizar Nube
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
        <!-- Dashboard -->
        <section id="sec-dashboard" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="card-neo p-6 border-l-4 border-emerald-500">
                    <p class="text-slate-400 text-xs font-bold uppercase">Ingresos</p>
                    <h2 id="total-incomes" class="text-2xl font-bold text-slate-800">$0.00</h2>
                </div>
                <div class="card-neo p-6 border-l-4 border-rose-500">
                    <p class="text-slate-400 text-xs font-bold uppercase">Pagos Realizados</p>
                    <h2 id="total-payments-made" class="text-2xl font-bold text-rose-600">$0.00</h2>
                </div>
                <div class="card-neo p-6 border-l-4 border-indigo-500">
                    <p class="text-slate-400 text-xs font-bold uppercase">Disponible</p>
                    <h2 id="capital-free" class="text-2xl font-bold text-indigo-600">$0.00</h2>
                </div>
            </div>
            <div class="bg-indigo-900 rounded-[2rem] p-6 text-white shadow-2xl relative">
                <p class="opacity-70 text-sm">Deuda Total Acumulada</p>
                <h3 id="global-debt" class="text-3xl font-bold mt-1">$0.00</h3>
                <p id="global-to-pay-month" class="mt-4 text-xs bg-white/20 inline-block px-3 py-1 rounded-full"></p>
            </div>
        </section>

        <!-- Secciones -->
        <section id="sec-cards" class="hidden space-y-6"></section>
        <section id="sec-history" class="hidden space-y-4"></section>
        <section id="sec-incomes" class="hidden space-y-4"></section>
    </main>

    <!-- NAVEGACIÓN -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t p-4 pb-6 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center px-4">
            <button onclick="showSection('dashboard')" class="flex flex-col items-center gap-1 text-indigo-600 nav-btn" id="nav-dashboard"><i class="fas fa-house-chimney text-xl"></i><span class="text-[10px] font-bold">INICIO</span></button>
            <button onclick="showSection('cards')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" id="nav-cards"><i class="fas fa-credit-card text-xl"></i><span class="text-[10px] font-bold">TARJETAS</span></button>
            <button onclick="showSection('history')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" id="nav-history"><i class="fas fa-clock-rotate-left text-xl"></i><span class="text-[10px] font-bold">PAGOS</span></button>
            <button onclick="showSection('incomes')" class="flex flex-col items-center gap-1 text-slate-400 nav-btn" id="nav-incomes"><i class="fas fa-sack-dollar text-xl"></i><span class="text-[10px] font-bold">INGRESOS</span></button>
        </div>
    </nav>

    <!-- MODALES (Sección para añadir contenido) -->
    <div id="modal-card" class="fixed inset-0 modal-bg hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8">
            <h3 class="text-xl font-bold mb-6">Tarjeta</h3>
            <input type="hidden" id="edit-card-id">
            <div class="space-y-4">
                <input type="text" id="card-name" placeholder="Nombre (ej. Oro)" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                <input type="text" id="card-bank" placeholder="Banco" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="card-cut" placeholder="Día Corte" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                    <input type="number" id="card-limit" placeholder="Día Pago" class="w-full p-4 bg-slate-50 rounded-2xl outline-none">
                </div>
                <button onclick="saveCard()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-bold">Guardar</button>
                <button onclick="closeModal('modal-card')" class="w-full text-slate-400 py-2">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // CONFIGURACIÓN (USANDO TU ID REAL)
        const CLIENT_ID = '764556873375-etu7k4dnc1o6uimg7kvai1m18v06s61i.apps.googleusercontent.com';
        const API_KEY = ''; // Opcional para Drive, lo principal es el CLIENT_ID
        const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let state = { cards: [], expenses: [], payments: [], incomes: [] };

        // --- SISTEMA BASE ---
        function init() {
            const local = localStorage.getItem('fapp_v3_data');
            if(local) state = JSON.parse(local);
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
            render();
        }

        function save() {
            localStorage.setItem('fapp_v3_data', JSON.stringify(state));
            render();
        }

        function showSection(id) {
            ['dashboard', 'cards', 'history', 'incomes'].forEach(s => {
                document.getElementById(`sec-${s}`).classList.toggle('hidden', s !== id);
                document.getElementById(`nav-${s}`).classList.toggle('text-indigo-600', s === id);
                document.getElementById(`nav-${s}`).classList.toggle('text-slate-400', s !== id);
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        // --- GOOGLE DRIVE ---
        function gapiLoaded() { gapi.load('client', () => gapi.client.init({discoveryDocs: DISCOVERY_DOCS})); }
        function gisLoaded() { tokenClient = google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: SCOPES, callback: (resp) => {
            if(resp.access_token) {
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('btn-sync').classList.remove('hidden');
                loadFromDrive();
            }
        }}); }

        function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

        async function saveToDrive() {
            const fileName = "finanzas_data.json";
            const content = JSON.stringify(state);
            const metadata = { name: fileName, mimeType: 'application/json' };
            
            const response = await gapi.client.drive.files.list({ q: `name = '${fileName}' and trashed = false` });
            const existingFile = response.result.files[0];

            const boundary = 'foo_bar_baz';
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";

            const multipartRequestBody =
                delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) +
                delimiter + 'Content-Type: application/json\r\n\r\n' + content + close_delim;

            const path = existingFile ? `/upload/drive/v3/files/${existingFile.id}?uploadType=multipart` : '/upload/drive/v3/files?uploadType=multipart';
            const method = existingFile ? 'PATCH' : 'POST';

            await fetch(`https://www.googleapis.com${path}`, {
                method: method,
                headers: { 'Authorization': `Bearer ${gapi.client.getToken().access_token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
                body: multipartRequestBody
            });
            alert("¡Sincronizado con éxito!");
        }

        async function loadFromDrive() {
            const response = await gapi.client.drive.files.list({ q: "name = 'finanzas_data.json' and trashed = false" });
            const file = response.result.files[0];
            if(file) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${gapi.client.getToken().access_token}` }
                });
                const cloudData = await res.json();
                if(confirm("¿Descargar datos de la nube?")) { state = cloudData; save(); }
            }
        }

        // --- LÓGICA DE NEGOCIO ---
        function saveCard() {
            const card = {
                id: Date.now(),
                name: document.getElementById('card-name')
